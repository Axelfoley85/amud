[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amud"
version = "0.1.0"
description = "A tiny, extendable text-based MUD"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
packages = ["game", "player", "server", "world"]
include-package-data = true
